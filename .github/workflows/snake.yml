name: Snake
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f3a6e&color_dots=#ebedf0,#c0d9ff,#79b0ff,#2f81f7,#0b4fd0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d2e8ff&color_dots=#161b22,#0e2a5c,#1f6feb,#58a6ff,#a5d6ff
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
