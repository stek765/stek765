.sub{opacity:0;animation:sub 10s ease infinite}
@keyframes sub{0%,48%{opacity:0}54%,86%{opacity:1}92%,100%{opacity:0}}
.head{animation:scan 5.0s linear infinite}
@keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(1280px)}}
@media (prefers-reduced-motion:reduce){.p,.c,.o,.head{animation:none}.c{transform:scaleY(0)}.name,.sub{animation:none;opacity:1}}
</style>
