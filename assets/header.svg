<style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.p{transform-box:fill-box;transform-origin:50% 50%;animation-name:pulse;animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
@keyframes pulse{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
.c{transform-box:fill-box;transform-origin:50% 50%;animation:collapse 10s cubic-bezier(.7,0,.3,1) infinite}
@keyframes collapse{0%,30%{transform:scaleY(1)}42%,88%{transform:scaleY(0)}100%{transform:scaleY(1)}}
.o{transform-box:fill-box;transform-origin:50% 50%;animation:calm 10s cubic-bezier(.7,0,.3,1) infinite}
@keyframes calm{0%,30%{transform:scaleY(1)}42%,88%{transform:scaleY(.4)}100%{transform:scaleY(1)}}
.name{opacity:0;animation:name 10s cubic-bezier(.2,.8,.2,1) infinite}
